name: Trigger Supabase stack deployment [leadminer]

on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions: {}
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger workflow in leadminer.io repository
        run: |
          repo_owner="ankaboot-source"
          repo_name="leadminer.io"
          event_type="trigger-supabase-deploy"

          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$repo_owner/$repo_name/dispatches \
            -d "{\"event_type\": \"$event_type\"}"
