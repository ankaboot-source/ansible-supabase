  # ── deploy: build + deploy to Cloudflare Pages (on push to default) ───────────
  deploy:
    runs-on: ${{ vars.BOUCLE_RUNS_ON || 'ubuntu-latest' }}
    if: |
      github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No cache: 'npm' — boucle is a shell project with no package-lock.json.
          # setup-node's npm cache requires a lock file and fails the job without
          # one. The Install dependencies step below already no-ops when there is
          # no lock file, so there is nothing to cache anyway.
      - name: Install dependencies
        run: "[ -f package-lock.json ] && npm ci || true"
      - name: Self-update
        run: |
          [ "${BOUCLE_UPDATE_DISABLE:-false}" = "true" ] && exit 0
          [ -d .boucle/bin ] || exit 0
          [ "${BOUCLE_PIPELINE_SOURCE:-}" = "push" ] && exit 0
          case "$GITHUB_REF" in
            refs/heads/*) _BRANCH="${GITHUB_REF#refs/heads/}" ;;
            *) exit 0 ;;
          esac
          [ "$_BRANCH" = "$BOUCLE_DEFAULT_BRANCH" ] || exit 0
          bash "$PWD/.boucle/bin/update" || echo "[boucle] WARN: self-update failed, continuing with current version" >&2
      - name: Deploy
        run: |
          export BOUCLE_PROJECT_ID="${{ github.repository }}"
          [ -d .boucle ] && export BOUCLE_HOME="$PWD/.boucle"
          $BOUCLE_HOME/bin/boucle-ci deploy

  # ── e2e: verify on live/preview URL ───────────────────────────────────────────
