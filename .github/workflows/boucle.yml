  # ── catchup: close issue after merge, cascade parent ─────────────────────────
  catchup:
    runs-on: ubuntu-latest
    continue-on-error: true  # boucle manages its own retries — exit 1 is normal (dispatch ABORT, reviewer re-trigger, etc.)
    if: |
      github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup
        run: |
          apt-get update -qq && apt-get install -y -qq curl jq git
