            mv "$JCODE_TMP/jcode-linux-x86_64.bin" "$HOME/.local/bin/jcode"
            chmod +x "$HOME/.local/bin/jcode"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Self-update
        run: |
          [ "${BOUCLE_UPDATE_DISABLE:-false}" = "true" ] && exit 0
          [ -d .boucle/bin ] || exit 0
          [ "${BOUCLE_PIPELINE_SOURCE:-}" = "push" ] && exit 0
          case "$GITHUB_REF" in
            refs/heads/*) _BRANCH="${GITHUB_REF#refs/heads/}" ;;
            *) exit 0 ;;
          esac
          [ "$_BRANCH" = "$BOUCLE_DEFAULT_BRANCH" ] || exit 0
          bash "$PWD/.boucle/bin/update" || echo "[boucle] WARN: self-update failed, continuing with current version" >&2
      - name: Reviewer
        env:
          BOUCLE_ISSUE: ${{ github.event.inputs.BOUCLE_ISSUE }}
