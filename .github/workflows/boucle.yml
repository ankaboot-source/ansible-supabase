    # Job-level concurrency: serialize reviewer runs per issue (mirrors
    # GitLab's resource_group: boucle-issue-$BOUCLE_ISSUE). The reviewer
    # only triggers on workflow_dispatch today, but this is defense-in-depth
    # — a future trigger path (e.g. pull_request_review) would otherwise
    # race the workflow_dispatch re-trigger path.
