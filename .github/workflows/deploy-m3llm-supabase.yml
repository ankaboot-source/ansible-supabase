name: Deploy supabase [m3llm]

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.SSH_IP_M3LLM }}
          username: ${{ vars.SSH_USERNAME_M3LLM }}
          key: ${{ secrets.SSH_PRIVATE_M3LLM }}
          command_timeout: 30m
          envs: M3LLM_INTERNAL_AUTH_TOKEN,M3LLM_LITELLM_MASTER_KEY,M3LLM_LITELLM_PROXY_URL,M3LLM_SUPABASE_GOOGLE_CLIENT_ID,M3LLM_SUPABASE_GITHUB_CLIENT_ID,M3LLM_SUPABASE_AZURE_CLIENT_ID,M3LLM_SUPABASE_OPENAI_API_KEY,M3LLM_SUPABASE_GOOGLE_SECRET,M3LLM_SUPABASE_GITHUB_SECRET,M3LLM_SUPABASE_AZURE_SECRET,M3LLM_SUPABASE_SMTP_USER,M3LLM_SUPABASE_DEPLOY_USER,M3LLM_SUPABASE_SMTP_PASSWORD,M3LLM_SUPABASE_SERVICE_ROLE_KEY,M3LLM_SUPABASE_SECRET_KEY_BASE,M3LLM_SUPABASE_S3_PROTOCOL_ACCESS_KEY_SECRET,M3LLM_SUPABASE_PG_META_CRYPTO_KEY,M3LLM_SUPABASE_LOGFLARE_PUBLIC_ACCESS_TOKEN,M3LLM_SUPABASE_LOGFLARE_PRIVATE_ACCESS_TOKEN,M3LLM_SUPABASE_JWT_SECRET,M3LLM_SUPABASE_VAULT_ENC_KEY,M3LLM_SUPABASE_DB_PASSWORD,M3LLM_SUPABASE_ANON_KEY,M3LLM_SUPABASE_SMTP_SENDER_NAME,M3LLM_SUPABASE_SMTP_HOST,M3LLM_SUPABASE_API_EXTERNAL_URL,M3LLM_SUPABASE_SITE_URL,M3LLM_SUPABASE_S3_PROTOCOL_ACCESS_KEY_ID,M3LLM_SUPABASE_POOLER_TENANT_ID,M3LLM_SUPABASE_SMTP_ADMIN_EMAIL
          script: |
            set -e
            
            mkdir -p ~/ansible-supabase
            cd ~/ansible-supabase
            
            # Initialize or update the repository using SSH
            # Backup existing dir if it's not a git repo, then clone fresh
            if [ ! -d ".git" ]; then
              if [ "$(ls -A)" ]; then
                mv ~/ansible-supabase ~/ansible-supabase.old.$(date +%s)
              fi
              git clone git@github.com:ankaboot-source/ansible-supabase.git ~/ansible-supabase
            fi
            git fetch origin main
            git reset --hard origin/main

            # Create the final .env file by merging template with secrets
            cat <<EOF > ./env/supabase-custom.yml
            $(cat ./env/supabase.yml | grep -v "changeit")
            
            # ---- SENSITIVE SECRETS (Injected from GitHub) ----
            deploy_user: '${M3LLM_SUPABASE_DEPLOY_USER}'
            api_external_url: '${M3LLM_SUPABASE_API_EXTERNAL_URL}'
            pooler_tenant_id: '${M3LLM_SUPABASE_POOLER_TENANT_ID}'
            s3_protocol_access_key_id: '${M3LLM_SUPABASE_S3_PROTOCOL_ACCESS_KEY_ID}'
            site_url: '${M3LLM_SUPABASE_SITE_URL}'
            smtp_admin_email: '${M3LLM_SUPABASE_SMTP_ADMIN_EMAIL}'
            smtp_host: '${M3LLM_SUPABASE_SMTP_HOST}'
            smtp_sender_name: '${M3LLM_SUPABASE_SMTP_SENDER_NAME}'
            sb_anon_key: '${M3LLM_SUPABASE_ANON_KEY}'
            postgres_db_pwd: '${M3LLM_SUPABASE_DB_PASSWORD}'
            vault_enc_key: '${M3LLM_SUPABASE_VAULT_ENC_KEY}'
            sb_jwt_secret: '${M3LLM_SUPABASE_JWT_SECRET}'
            logflare_private_access_token: '${M3LLM_SUPABASE_LOGFLARE_PRIVATE_ACCESS_TOKEN}'
            logflare_public_access_token: '${M3LLM_SUPABASE_LOGFLARE_PUBLIC_ACCESS_TOKEN}'
            pg_meta_crypto_key: '${M3LLM_SUPABASE_PG_META_CRYPTO_KEY}'
            s3_protocol_access_key_secret: '${M3LLM_SUPABASE_S3_PROTOCOL_ACCESS_KEY_SECRET}'
            secret_key_base: '${M3LLM_SUPABASE_SECRET_KEY_BASE}'
            sb_service_role_key: '${M3LLM_SUPABASE_SERVICE_ROLE_KEY}'
            smtp_password: '${M3LLM_SUPABASE_SMTP_PASSWORD}'
            smtp_user: '${M3LLM_SUPABASE_SMTP_USER}'
            azure_secret: '${M3LLM_SUPABASE_AZURE_SECRET}'
            github_secret: '${M3LLM_SUPABASE_GITHUB_SECRET}'
            google_secret: '${M3LLM_SUPABASE_GOOGLE_SECRET}'
            openai_api_key: '${M3LLM_SUPABASE_OPENAI_API_KEY}'
            google_client_id: '${M3LLM_SUPABASE_GOOGLE_CLIENT_ID}'
            github_client_id: '${M3LLM_SUPABASE_GITHUB_CLIENT_ID}'
            azure_client_id: '${M3LLM_SUPABASE_AZURE_CLIENT_ID}'
            EOF

            mv ./env/supabase-custom.yml ./env/supabase.yml


            # inject env vars into functions service
            sed -i '/VERIFY_JWT:/a\
                  LITELLM_PROXY_URL: '${LITELLM_PROXY_URL}'\
                  LITELLM_MASTER_KEY: '${LITELLM_MASTER_KEY}'\
                  INTERNAL_AUTH_TOKEN: '${INTERNAL_AUTH_TOKEN}'
            ' ./roles/supabase/templates/docker-compose-supabase.yml.j2

            # Override playbook-supabase.yml
            cat <<EOF > playbook-supabase.yml
            - hosts: localhost
              roles:
                - supabase
            EOF

            # Deploy supabase
            sudo ./install.sh

        env:
          LITELLM_PROXY_URL: ${{ vars.M3LLM_LITELLM_PROXY_URL }}
          LITELLM_MASTER_KEY: ${{ secrets.M3LLM_LITELLM_MASTER_KEY }}
          INTERNAL_AUTH_TOKEN: ${{ secrets.M3LLM_INTERNAL_AUTH_TOKEN }}
          M3LLM_SUPABASE_DEPLOY_USER: ${{ vars.M3LLM_SUPABASE_DEPLOY_USER }}
          M3LLM_SUPABASE_API_EXTERNAL_URL: ${{ vars.M3LLM_SUPABASE_API_EXTERNAL_URL }}
          M3LLM_SUPABASE_POOLER_TENANT_ID: ${{ vars.M3LLM_SUPABASE_POOLER_TENANT_ID }}
          M3LLM_SUPABASE_S3_PROTOCOL_ACCESS_KEY_ID: ${{ vars.M3LLM_SUPABASE_S3_PROTOCOL_ACCESS_KEY_ID }}
          M3LLM_SUPABASE_SITE_URL: ${{ vars.M3LLM_SUPABASE_SITE_URL }}
          M3LLM_SUPABASE_SMTP_ADMIN_EMAIL: ${{ vars.M3LLM_SUPABASE_SMTP_ADMIN_EMAIL }}
          M3LLM_SUPABASE_SMTP_HOST: ${{ vars.M3LLM_SUPABASE_SMTP_HOST }}
          M3LLM_SUPABASE_SMTP_SENDER_NAME: ${{ vars.M3LLM_SUPABASE_SMTP_SENDER_NAME }}
          M3LLM_SUPABASE_SMTP_USER: ${{ vars.M3LLM_SUPABASE_SMTP_USER }}
          M3LLM_SUPABASE_ANON_KEY: ${{ secrets.M3LLM_SUPABASE_ANON_KEY }}
          M3LLM_SUPABASE_DB_PASSWORD: ${{ secrets.M3LLM_SUPABASE_DB_PASSWORD }}
          M3LLM_SUPABASE_VAULT_ENC_KEY: ${{ secrets.M3LLM_SUPABASE_VAULT_ENC_KEY }}
          M3LLM_SUPABASE_JWT_SECRET: ${{ secrets.M3LLM_SUPABASE_JWT_SECRET }}
          M3LLM_SUPABASE_LOGFLARE_PRIVATE_ACCESS_TOKEN: ${{ secrets.M3LLM_SUPABASE_LOGFLARE_PRIVATE_ACCESS_TOKEN }}
          M3LLM_SUPABASE_LOGFLARE_PUBLIC_ACCESS_TOKEN: ${{ secrets.M3LLM_SUPABASE_LOGFLARE_PUBLIC_ACCESS_TOKEN }}
          M3LLM_SUPABASE_PG_META_CRYPTO_KEY: ${{ secrets.M3LLM_SUPABASE_PG_META_CRYPTO_KEY }}
          M3LLM_SUPABASE_S3_PROTOCOL_ACCESS_KEY_SECRET: ${{ secrets.M3LLM_SUPABASE_S3_PROTOCOL_ACCESS_KEY_SECRET }}
          M3LLM_SUPABASE_SECRET_KEY_BASE: ${{ secrets.M3LLM_SUPABASE_SECRET_KEY_BASE }}
          M3LLM_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.M3LLM_SUPABASE_SERVICE_ROLE_KEY }}
          M3LLM_SUPABASE_SMTP_PASSWORD: ${{ secrets.M3LLM_SUPABASE_SMTP_PASSWORD }}
          M3LLM_SUPABASE_AZURE_SECRET: ${{ secrets.M3LLM_SUPABASE_AZURE_SECRET }}
          M3LLM_SUPABASE_GITHUB_SECRET: ${{ secrets.M3LLM_SUPABASE_GITHUB_SECRET }}
          M3LLM_SUPABASE_GOOGLE_SECRET: ${{ secrets.M3LLM_SUPABASE_GOOGLE_SECRET }}
          M3LLM_SUPABASE_OPENAI_API_KEY: ${{ secrets.M3LLM_SUPABASE_OPENAI_API_KEY }}
          M3LLM_SUPABASE_AZURE_CLIENT_ID: ${{ vars.M3LLM_SUPABASE_AZURE_CLIENT_ID }}
          M3LLM_SUPABASE_GITHUB_CLIENT_ID: ${{ vars.M3LLM_SUPABASE_GITHUB_CLIENT_ID }}
          M3LLM_SUPABASE_GOOGLE_CLIENT_ID: ${{ vars.M3LLM_SUPABASE_GOOGLE_CLIENT_ID }}


