---
# Backup role — pgBackRest in supabase-db + WAL archiving + PITR + verify + monitoring
# Idempotent: re-running does not re-init the stanza or expire backups.

- name: Assert required variables are set
  assert:
    that:
      - deploy_user is defined
      - supabase_data_path is defined
      - backup_stanza_name is defined
      - backup_repo_type in ['minio', 's3', 'posix']
      - backup_creds_source in ['env', 'vault']
    msg: "backup role: required variables missing or invalid"

- name: Warn loudly when repo is local (no off-box protection)
  debug:
    msg: >-
      WARNING: backup_repo_type is '{{ backup_repo_type }}' (local).
      A local repo on the same machine provides NO off-box protection.
      If the server dies, the backups die with it. For real protection,
      set backup_repo_type to 's3' and point it at an external object store
      (Cloudflare R2, Backblaze B2, AWS S3, etc.).
  when: backup_repo_type in ['minio', 'posix']

- name: Warn when credentials are in .env (plaintext)
  debug:
    msg: >-
      WARNING: backup_creds_source is 'env' (default). S3/MinIO credentials
      are rendered into the backup .env file in plaintext. For production,
      set backup_creds_source to 'vault' and use Ansible Vault.
  when: backup_creds_source == 'env'

- name: Warn when restore drill is enabled (resource cost)
  debug:
    msg: >-
      WARNING: backup_restore_drill is enabled. The restore drill performs a
      full restore into a throwaway volume and starts a second Postgres
      instance. This requires extra disk space (~1x DB size) and memory.
      Disable on small VMs with backup_restore_drill: false.
  when: backup_restore_drill | bool

# --- Create backup directory structure ---
- name: Create backup directory
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"
  loop:
    - "{{ backup_compose_dir }}"
    - "{{ backup_compose_dir }}/volumes/pgbackrest"
    - "{{ backup_compose_dir }}/volumes/pgbackrest-log"
    - "{{ backup_compose_dir }}/volumes/pgbackrest-spool"
    - "{{ backup_compose_dir }}/{{ backup_path }}"
    - "{{ backup_log_dir }}"
  vars:
    backup_compose_dir: "/home/{{ deploy_user }}/backup"

# --- Ensure postgres (UID 100) can access pgbackrest dirs ---
- name: Fix pgbackrest directory ownership for postgres access
  file:
    path: "{{ item }}"
    state: directory
    owner: "100"
    group: "101"
    mode: "0755"
  loop:
    - "{{ backup_compose_dir }}/volumes/pgbackrest"
    - "{{ backup_compose_dir }}/volumes/pgbackrest-log"
    - "{{ backup_compose_dir }}/volumes/pgbackrest-spool"
  vars:
    backup_compose_dir: "/home/{{ deploy_user }}/backup"

# --- Render pgBackRest config ---
- name: Render pgbackrest.conf
  template:
    src: pgbackrest.conf.j2
    dest: "{{ backup_compose_dir }}/pgbackrest.conf"
    owner: "100"
    group: "101"
    mode: "0644"
    unsafe_writes: yes
  vars:
    backup_compose_dir: "/home/{{ deploy_user }}/backup"
  register: pgbackrest_conf

# --- Render backup compose file ---
- name: Render backup docker-compose
  template:
    src: docker-compose-backup.yml.j2
    dest: "{{ backup_compose_dir }}/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0640"
  vars:
    backup_compose_dir: "/home/{{ deploy_user }}/backup"
  register: backup_compose

# --- Render .env for backup compose (always — compose references it via env_file) ---
# In 'env' mode: plaintext credentials from env/supabase.yml.
# In 'vault' mode: values come from Ansible Vault vars; the .env is still on the box
# but the Ansible vars file is vault-encrypted (not plaintext in env/supabase.yml).
- name: Render backup .env
  template:
    src: backup-env.j2
    dest: "{{ backup_compose_dir }}/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
  vars:
    backup_compose_dir: "/home/{{ deploy_user }}/backup"

# --- Render backup scripts ---
- name: Render backup scripts
  template:
    src: "backup-scripts/{{ item.name }}.j2"
    dest: "{{ backup_scripts_dir }}/{{ item.name }}"
    owner: "root"
    group: "root"
    mode: "0755"
  loop:
    - { name: "backup-full.sh" }
    - { name: "backup-diff.sh" }
    - { name: "backup-verify.sh" }
    - { name: "backup-storage.sh" }
    - { name: "backup-pgsodium.sh" }
    - { name: "backup-drill.sh" }
  loop_control:
    label: "{{ item.name }}"

# --- Bring up the backup stack (minio + minio-init bucket creation + exporter) ---
# minio-init runs once (restart: on-failure) after minio is healthy to create the bucket.
- name: Bring up backup stack
  command: docker compose up -d
  args:
    chdir: "{{ backup_compose_dir }}"
  vars:
    backup_compose_dir: "/home/{{ deploy_user }}/backup"
  changed_when: false
  when: backup_repo_type == 'minio' or (backup_monitoring_enabled | default(false) | bool)

# --- Wait for MinIO bucket creation (minio-init exits 0 when its 'mc mb' finished) ---
# stanza-create needs the bucket to exist in the repo; otherwise it fails with 039.
- name: Wait for MinIO bucket creation
  command: docker inspect --format='{% raw %}{{.State.ExitCode}}{% endraw %}' supabase-minio-init{{ '-' + deploy_env if deploy_env != 'changeit' else '' }}
  register: minio_bucket_ready
  until: (minio_bucket_ready.rc == 0) and (minio_bucket_ready.stdout == '0')
  retries: 40
  delay: 5
  changed_when: false
  when: backup_repo_type == 'minio'

# --- Wait for supabase-db to be READY (accepting connections, not in recovery) ---
# pgbackrest commands (stanza-create, backup) need a live primary, not just a running container.
- name: Wait for supabase-db to be ready
  # The recovery half used to read `! psql ... | grep -q t`, which treats a
  # *failed* psql as proof the cluster is not in recovery: no output means grep
  # finds no "t", and the negation turns that into success. So the check passed
  # in exactly the case it exists to catch, and pgbackrest then refused the
  # backup with "[056] ... are all available clusters in recovery?".
  # Require an explicit "f" instead — anything else, including silence, retries.
  # The user is the one pgbackrest itself connects as (pg1-user), so a failure
  # here is the same failure the backup would hit.
  shell: |
    set -u
    c=supabase-db{{ '-' + deploy_env if deploy_env != 'changeit' else '' }}
    docker exec "$c" timeout 5 pg_isready \
      -U supabase_admin -h 127.0.0.1 -p {{ postgres_port | default(5432) }} \
      >/dev/null 2>&1 || exit 1
    r=$(docker exec "$c" timeout 5 psql -U supabase_admin -d postgres \
          -tAc "select pg_is_in_recovery()" 2>/dev/null | tr -d '[:space:]')
    [ "$r" = "f" ]
  register: db_ready
  until: db_ready.rc == 0
  retries: 120
  delay: 5
  changed_when: false

# --- Create stanza (idempotent — pgBackRest skips existing stanzas) ---
- name: Create pgBackRest stanza
  command: >
    docker exec supabase-db{{ '-' + deploy_env if deploy_env != 'changeit' else '' }}
    pgbackrest --stanza={{ backup_stanza_name }} --log-level-console=info stanza-create
  register: stanza_create_result
  changed_when: "'already exists' not in stanza_create_result.stdout | default('')"
  failed_when: false

# --- If stanza-create fails with 028 (stale metadata), reset MinIO to a clean slate and retry ---
# The old repo is bound to a different DB system-id and is unusable; the clean
# reset must RE-CREATE the bucket (minio-init's `mc mb` runs because the one-shot
# container is removed). Wiping volumes/minio under the running MinIO and
# retrying would hit `039 NoSuchBucket` — the bucket would never come back.
- name: Backup and reset stale MinIO data
  shell: |
    set -eu
    cd {{ backup_compose_dir }}
    STALE_BACKUP="volumes/minio-stale-$(date +%Y%m%d-%H%M%S)"
    echo "Stale stanza detected — preserving old MinIO data to $STALE_BACKUP"
    docker compose stop minio minio-init >/dev/null 2>&1 || true
    mv volumes/minio "$STALE_BACKUP" 2>/dev/null || true
    # Drop the already-consumed one-shot so compose re-runs its `mc mb` entrypoint.
    docker compose rm -f minio minio-init >/dev/null 2>&1 || true
    docker compose up -d minio minio-init
    echo "MinIO reset. Old data preserved at: $STALE_BACKUP"
  when: >
    backup_repo_type == 'minio'
    and stanza_create_result.rc | default(0) != 0
    and (
        '028' in ((stanza_create_result.stderr | default('')) ~ (stanza_create_result.stdout | default('')))
        or '103' in ((stanza_create_result.stderr | default('')) ~ (stanza_create_result.stdout | default('')))
    )
  register: backup_clean_result
  changed_when: true
  vars:
    backup_compose_dir: "/home/{{ deploy_user }}/backup"

# --- After a stale reset, wait for the re-created bucket before retrying ---
- name: Wait for MinIO bucket re-created after stale reset
  command: docker inspect --format='{% raw %}{{.State.ExitCode}}{% endraw %}' supabase-minio-init{{ '-' + deploy_env if deploy_env != 'changeit' else '' }}
  register: minio_bucket_ready_retry
  until: (minio_bucket_ready_retry.rc == 0) and (minio_bucket_ready_retry.stdout == '0')
  retries: 40
  delay: 5
  changed_when: false
  when: backup_clean_result is changed

- name: Create pgBackRest stanza (retry after MinIO reset)
  command: >
    docker exec supabase-db{{ '-' + deploy_env if deploy_env != 'changeit' else '' }}
    pgbackrest --stanza={{ backup_stanza_name }} --log-level-console=info stanza-create
  register: stanza_create_retry
  changed_when: "'already exists' not in stanza_create_retry.stdout | default('')"
  failed_when: false
  when: backup_clean_result is changed

- name: Check stanza-create result
  fail:
    msg: >-
      stanza-create failed.
      {% if backup_clean_result is changed %}
      {{ stanza_create_retry.stderr or stanza_create_retry.stdout or 'unknown error' }}
      {% else %}
      {{ stanza_create_result.stderr or stanza_create_result.stdout or 'unknown error' }}
      {% endif %}
  when: >
    (backup_clean_result is changed
     and stanza_create_retry.rc | default(0) != 0
     and 'already exists' not in (stanza_create_retry.stdout | default('')))
    or
    (backup_clean_result is not changed
     and stanza_create_result.rc | default(0) != 0
     and 'already exists' not in (stanza_create_result.stdout | default('')))

# --- Wait until WAL archiving actually reaches the repository ---
# The db container starts with archive_mode=on and an archive_command pointing
# at a stanza that does not exist yet, so every push until stanza-create fails:
#
#   ERROR: [103]: unable to find a valid repository
#          unable to load info file '.../archive/main/archive.info'
#          HINT: has a stanza-create been performed?
#
# PostgreSQL retries with a growing back-off, so after the stanza appears the
# pending segment can sit unarchived for up to a minute — while the backup
# below waits only 60s for it and then aborts with
# "[082]: WAL segment ... was not archived before the 60000ms timeout".
# `pgbackrest check` is built for this: it forces a WAL switch and confirms the
# segment lands in the repository, so it both verifies and unblocks.
- name: Wait for WAL archiving to reach the repository
  command: >
    docker exec supabase-db{{ '-' + deploy_env if deploy_env != 'changeit' else '' }}
    pgbackrest --stanza={{ backup_stanza_name }} --log-level-console=info check
  register: archive_check
  until: archive_check.rc == 0
  retries: 12
  delay: 10
  changed_when: false

# --- Initial full backup on enable ---
- name: Initial full backup on enable
  command: >
    docker exec supabase-db{{ '-' + deploy_env if deploy_env != 'changeit' else '' }}
    pgbackrest --stanza={{ backup_stanza_name }} --type=full --log-level-console=info backup
  when: backup_initial_on_enable | bool
  register: initial_backup_result
  failed_when: initial_backup_result.rc != 0

# --- Cron schedules ---
- name: Install full backup cron
  cron:
    name: "supabase-backup-full"
    minute: "{{ backup_cron_full.split()[0] }}"
    hour: "{{ backup_cron_full.split()[1] }}"
    day: "{{ backup_cron_full.split()[2] }}"
    month: "{{ backup_cron_full.split()[3] }}"
    weekday: "{{ backup_cron_full.split()[4] }}"
    job: "{{ backup_scripts_dir }}/backup-full.sh >> {{ backup_log_dir }}/full.log 2>&1"
    state: present

- name: Install differential backup cron
  cron:
    name: "supabase-backup-diff"
    minute: "{{ backup_cron_diff.split()[0] }}"
    hour: "{{ backup_cron_diff.split()[1] }}"
    day: "{{ backup_cron_diff.split()[2] }}"
    month: "{{ backup_cron_diff.split()[3] }}"
    weekday: "{{ backup_cron_diff.split()[4] }}"
    job: "{{ backup_scripts_dir }}/backup-diff.sh >> {{ backup_log_dir }}/diff.log 2>&1"
    state: present

- name: Install daily verify cron
  cron:
    name: "supabase-backup-verify"
    minute: "{{ backup_cron_verify.split()[0] }}"
    hour: "{{ backup_cron_verify.split()[1] }}"
    day: "{{ backup_cron_verify.split()[2] }}"
    month: "{{ backup_cron_verify.split()[3] }}"
    weekday: "{{ backup_cron_verify.split()[4] }}"
    job: "{{ backup_scripts_dir }}/backup-verify.sh >> {{ backup_log_dir }}/verify.log 2>&1"
    state: present
  when: backup_repo_check | bool

- name: Install storage backup cron (after full backup)
  cron:
    name: "supabase-backup-storage"
    minute: "30"
    hour: "3"
    job: "{{ backup_scripts_dir }}/backup-storage.sh >> {{ backup_log_dir }}/storage.log 2>&1"
    state: present
  when: backup_storage_enabled | bool

- name: Install pgsodium key backup cron (after full backup)
  cron:
    name: "supabase-backup-pgsodium"
    minute: "15"
    hour: "3"
    job: "{{ backup_scripts_dir }}/backup-pgsodium.sh >> {{ backup_log_dir }}/pgsodium.log 2>&1"
    state: present
  when: backup_pgsodium_enabled | bool

- name: Install restore drill cron (opt-in)
  cron:
    name: "supabase-backup-drill"
    minute: "{{ backup_cron_drill.split()[0] }}"
    hour: "{{ backup_cron_drill.split()[1] }}"
    day: "{{ backup_cron_drill.split()[2] }}"
    month: "{{ backup_cron_drill.split()[3] }}"
    weekday: "{{ backup_cron_drill.split()[4] }}"
    job: "{{ backup_scripts_dir }}/backup-drill.sh >> {{ backup_log_dir }}/drill.log 2>&1"
    state: present
  when: backup_restore_drill | bool

# --- Monitoring integration ---
- name: Render Prometheus alert rules
  template:
    src: prometheus-backup-alerts.yml.j2
    dest: "/home/{{ deploy_user }}/monitor/prometheus-backup-alerts.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0640"
  when: backup_monitoring_enabled | bool
  notify: reload prometheus

- name: Render Grafana dashboard
  template:
    src: grafana/backup.json.j2
    dest: "/home/{{ deploy_user }}/monitor/dashboards/backup.json"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0640"
  when: backup_monitoring_enabled | bool

# --- Run storage + pgsodium backup once on enable ---
- name: Run storage backup on enable
  command: "{{ backup_scripts_dir }}/backup-storage.sh"
  when: backup_storage_enabled | bool
  changed_when: false
  failed_when: false

- name: Run pgsodium key backup on enable
  command: "{{ backup_scripts_dir }}/backup-pgsodium.sh"
  when: backup_pgsodium_enabled | bool
  changed_when: false
  failed_when: false

# --- Flush handlers ---
- meta: flush_handlers
