---
- name: Check if Supabase folder exists
  ansible.builtin.stat:
    path: "/home/{{ deploy_user }}/supabase"
  register: supabase_dir

- name: Clone Supabase
  ansible.builtin.git:
    repo: https://github.com/supabase/supabase
    dest: "/home/{{ deploy_user }}/supabase"
    depth: 1
  when: not supabase_dir.stat.exists

- name: Ensure correct ownership
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/supabase"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    recurse: yes

- name: Ensure /var/log/postgresql directory exists
  ansible.builtin.file:
    path: /var/log/postgresql
    state: directory
    owner: "100"
    group: "101"
    mode: "0755"

- name: Ensure Supabase data directory exists
  ansible.builtin.file:
    path: "{{ supabase_data_path }}"
    state: directory
    owner: "100"
    group: "101"
    mode: '0755'

- name: Ensure Supabase public domain is configured
  ansible.builtin.assert:
    that:
      - "(((projects | default({})).supabase | default({})).domain | default('')) not in ['', 'changeit', 'your-domain.com', 'sb.example.com']"
    fail_msg: >-
      projects.supabase.domain is not set to a real public domain. It is used to
      locate the Caddy TLS certificate and to generate the Postgres SSL
      certificate. Run setup.sh so it is rendered from required.supabase_domain.
    quiet: yes

- name: Check if Caddy certificate exists
  ansible.builtin.stat:
    path: "{{ caddy_cert_base_path }}/{{ projects.supabase.domain }}/{{ projects.supabase.domain }}.crt"
  register: caddy_cert

- name: Ensure Certs directory exists
  ansible.builtin.file:
    path: "{{ postgres_cert_path }}"
    state: directory
    owner: "100"
    group: "101"
    mode: "0755"

- name: Copy Postgres SSL certificate
  ansible.builtin.copy:
    src: "{{ caddy_cert_base_path }}/{{ projects.supabase.domain }}/{{ projects.supabase.domain }}.crt"
    dest: "{{ postgres_cert_path }}/server.crt"
    remote_src: yes
    owner: "100"
    group: "101"
    mode: "0644"
  when: caddy_cert.stat.exists

- name: Copy Postgres SSL key
  ansible.builtin.copy:
    src: "{{ caddy_cert_base_path }}/{{ projects.supabase.domain }}/{{ projects.supabase.domain }}.key"
    dest: "{{ postgres_cert_path }}/server.key"
    remote_src: yes
    owner: "100"
    group: "101"
    mode: "0600"
  when: caddy_cert.stat.exists

- name: Validate Postgres cert exists
  ansible.builtin.stat:
    path: "{{ postgres_cert_path }}/server.crt"
  register: pg_cert

- name: Check Postgres cert matches the configured domain
  ansible.builtin.shell: |
    openssl x509 -in {{ postgres_cert_path }}/server.crt -noout -subject -nameopt RFC2253 | grep -q "CN={{ projects.supabase.domain }}"
  register: pg_cert_check
  failed_when: false
  changed_when: false
  when: pg_cert.stat.exists

- name: Generate self-signed cert if missing or domain mismatch
  ansible.builtin.shell: |
    openssl req -x509 -nodes -days 365 \
      -newkey rsa:2048 \
      -keyout {{ postgres_cert_path }}/server.key \
      -out {{ postgres_cert_path }}/server.crt \
      -subj "/CN={{ projects.supabase.domain }}" \
      -addext "subjectAltName=DNS:{{ projects.supabase.domain }},DNS:localhost,IP:127.0.0.1{% if ansible_default_ipv4 is defined and ansible_default_ipv4.address is defined %},IP:{{ ansible_default_ipv4.address }}{% endif %}"
  when: >
    (not pg_cert.stat.exists) or
    (pg_cert_check.rc | default(1)) != 0

- name: Set ownership and permissions on generated Postgres SSL files
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "100"
    group: "101"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ postgres_cert_path }}/server.key", mode: "0600" }
    - { path: "{{ postgres_cert_path }}/server.crt", mode: "0644" }

- name: Create Supabase files
  template:
    src: "{{ item.src }}.j2"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  with_items:
    - { src: "docker-compose-supabase.yml", dest: "/home/{{ deploy_user }}/{{ supabase_path }}/docker-compose-supabase.yml", mode: '0664' }
    - { src: "kong-supabase.yml", dest: "/home/{{ deploy_user }}/{{ supabase_path }}/{{ kong_conf_path }}/kong.yml", mode: '0664' }
    - { src: "env-supabase", dest: "/home/{{ deploy_user }}/{{ supabase_path }}/.env", mode: '0664' }
    - { src: "start-supabase.sh", dest: "/home/{{ deploy_user }}/{{ supabase_path }}/start-supabase.sh", mode: '0755' }

- name: Create backup network if needed
  shell: |
    NETWORK_NAME="supabase-backup-net{{ '-' + deploy_env if deploy_env != 'changeit' else '' }}"
    docker network inspect "$NETWORK_NAME" >/dev/null 2>&1 || docker network create "$NETWORK_NAME"
  when: backup_enabled | default(false) | bool

- name: Prepare backup paths on host
  copy:
    dest: "/tmp/prepare-backup-paths.sh"
    mode: "0755"
    content: |
      #!/bin/sh
      set -eu
      BACKUP_DIR="/home/{{ deploy_user }}/backup"
      BIN_DIR="$BACKUP_DIR/pgbackrest-bin"
      IMAGE="{{ pgbackrest_image | default('woblerr/pgbackrest:2.58.0-alpine') }}"

      # Remove Docker-created dirs that shadow our bind-mount sources
      for p in /usr/bin/pgbackrest "$BIN_DIR/pgbackrest" "$BIN_DIR"/lib*; do
        [ -e "$p" ] || continue
        [ -d "$p" ] && rm -rf "$p" || rm -f "$p"
      done

      # Extract pgbackrest binary + shared libraries from the Docker image
      if [ ! -f "$BIN_DIR/pgbackrest" ]; then
        echo "Pulling $IMAGE..."
        docker pull "$IMAGE"
        TMPCTR="pgbackrest-extract-$$"
        docker create --name "$TMPCTR" "$IMAGE"
        mkdir -p "$BIN_DIR"
        docker cp "$TMPCTR:/usr/bin/pgbackrest" "$BIN_DIR/pgbackrest"
        # Copy entire /usr/lib from Alpine image — docker cp doesn't support globs
        docker cp "$TMPCTR:/usr/lib" "$BIN_DIR/lib-alpine"
        # Move only the libs pgbackrest needs into the flat BIN_DIR
        for lib in libbz2.so libcrypto.so libcurl.so libgcrypt.so libgpg-error.so libhistory.so libintl.so libjson-c.so liblz4.so liblzma.so libpcre2.so libpq.so libprotobuf-c.so libssh2.so libssl.so libxml2.so libz.so libzstd.so libc.musl ld-musl; do
          cp "$BIN_DIR/lib-alpine/${lib}"* "$BIN_DIR/" 2>/dev/null || true
        done
        rm -rf "$BIN_DIR/lib-alpine"
        docker rm "$TMPCTR"
        chmod 755 "$BIN_DIR/pgbackrest"
        chown -R root:root "$BIN_DIR"
        echo "Extracted pgbackrest binary and $(ls "$BIN_DIR"/lib* 2>/dev/null | wc -l) shared libraries"
      fi

      # Verify extraction succeeded
      if [ ! -f "$BIN_DIR/pgbackrest" ]; then
        echo "ERROR: pgbackrest binary not found in $BIN_DIR" >&2
        exit 1
      fi
      missing=""
      for lib in libpq.so libxml2.so libssl.so libcrypto.so liblz4.so libz.so libzstd.so ld-musl; do
        ls "$BIN_DIR/${lib}"* >/dev/null 2>&1 || missing="$missing $lib"
      done
      if [ -n "$missing" ]; then
        echo "ERROR: missing shared libraries:$missing" >&2
        exit 1
      fi

      # Create wrapper script that sets LD_LIBRARY_PATH only for pgbackrest
      # (setting it on the container env would poison PostgreSQL's own libraries)
      printf '#!/bin/sh\nexport LD_LIBRARY_PATH=/usr/lib/pgbackrest-bin\nexec /usr/lib/pgbackrest-bin/pgbackrest "$@"\n' > "$BACKUP_DIR/pgbackrest-wrapper"
      chmod 755 "$BACKUP_DIR/pgbackrest-wrapper"

      # Ensure pgbackrest.conf placeholder exists (backup role renders the real config)
      CONF="$BACKUP_DIR/pgbackrest.conf"
      [ -f "$CONF" ] || install -m 0640 /dev/null "$CONF"

      # Fix ownership for directories that postgres (UID 100) writes to
      mkdir -p "$BACKUP_DIR/volumes/pgbackrest/lock"
      mkdir -p "$BACKUP_DIR/volumes/pgbackrest-log"
      mkdir -p "$BACKUP_DIR/volumes/pgbackrest-spool/archive"
      chown -R 100:101 "$BACKUP_DIR/volumes/pgbackrest"
      chown -R 100:101 "$BACKUP_DIR/volumes/pgbackrest-log"
      chown -R 100:101 "$BACKUP_DIR/volumes/pgbackrest-spool"
  when: backup_enabled | default(false) | bool

- name: Run backup path preparation
  command: bash /tmp/prepare-backup-paths.sh
  when: backup_enabled | default(false) | bool

- name: Start Supabase
  command: "bash /home/{{ deploy_user }}/{{ supabase_path }}/start-supabase.sh"
