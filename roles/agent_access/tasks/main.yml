---
# SSH-stdio MCP agent for AI agents and the companion info CLI.
# The keypair is the deployment's identity: agents `ssh <alias> supabase-agent`
# to reach the MCP server. The pubkey is the only thing that ever leaves the
# server; the private key is printed ONCE in the end-of-run recap.
#
# Manifest path /etc/supabase/instance.json is a hardwired contract — do NOT
# make it configurable. See roles/manifest/tasks/main.yml for the writer.

- name: Ensure /etc/supabase directory exists
  ansible.builtin.file:
    path: /etc/supabase
    state: directory
    owner: root
    group: root
    mode: "0755"

# ---------------------------------------------------------------------------
# Provision the dedicated read-only Postgres role (agent_reader).
#
# This is the security boundary that makes the MCP agent DB-side read-only:
# the supabase-agent connects as this role (not the `postgres` superuser), so
# the database itself rejects any write — independent of the MCP server's own
# SQL filtering. The role is granted SELECT across every Supabase schema and
# future tables are auto-covered via ALTER DEFAULT PRIVILEGES.
#
# Runs AFTER the supabase role has brought the DB container up (see playbook
# ordering: supabase -> manifest -> agent_access). Provisioning uses the
# supabase_admin superuser (backup/migrate already rely on it being superuser).
# Idempotent: the role-existence check short-circuits on re-runs.
# ---------------------------------------------------------------------------

- name: Check if agent_reader role exists
  ansible.builtin.command: >
    docker exec {{ agent_reader_db_container }} psql
    -U {{ agent_reader_db_admin }} -d postgres -tAc
    "SELECT 1 FROM pg_roles WHERE rolname='{{ agent_reader_role }}'"
  register: agent_reader_exists
  changed_when: false
  become: true

- name: Stage agent_reader provisioning SQL on host
  ansible.builtin.copy:
    src: agent_reader.sql
    dest: /tmp/agent_reader.sql
    mode: "0600"
  become: true

- name: Provision agent_reader read-only role
  ansible.builtin.shell: >
    docker exec -i {{ agent_reader_db_container }} psql
    -U {{ agent_reader_db_admin }} -d postgres -v ON_ERROR_STOP=1 -f - < /tmp/agent_reader.sql
  register: agent_reader_provision
  become: true
  # Only provision on the FIRST setup — once the role exists, its (SELECT-only)
  # grants and default privileges are already in place and must NOT be
  # re-applied (re-running could overwrite nothing, but wastes a round-trip and
  # risks re-granting on a role the operator deliberately customised).
  when: agent_reader_exists.stdout | trim != "1"

- name: Clean up staged agent_reader provisioning SQL
  ansible.builtin.file:
    path: /tmp/agent_reader.sql
    state: absent
  become: true

- name: Probe that agent_reader cannot write (defense in depth)
  ansible.builtin.command: >
    docker exec {{ agent_reader_db_container }} psql
    -U {{ agent_reader_role }} -d postgres -v ON_ERROR_STOP=1 -c
    "CREATE TABLE public._agent_ro_probe(id int)"
  register: agent_reader_write_probe
  become: true
  failed_when: false
  changed_when: false
  when: agent_reader_provision.changed | default(false)

- name: Assert write was rejected by the database
  ansible.builtin.assert:
    that:
      - agent_reader_write_probe.rc != 0
    fail_msg: >
      agent_reader was unexpectedly able to CREATE a table. The read-only
      boundary is not enforced by the database — do not proceed.
    success_msg: "Confirmed: the database rejects writes from {{ agent_reader_role }}."
  become: true
  when: agent_reader_provision.changed | default(false)

# Use community.crypto when present (gives us a `register`able result with
# .changed) and fall back to a raw ssh-keygen otherwise. The fallback exists
# so the role still works on minimal installs that didn't pull in the
# community collection.
- name: Generate ed25519 agent keypair (community.crypto)
  community.crypto.openssh_keypair:
    path: "{{ agent_key_path }}"
    type: ed25519
    comment: "{{ agent_key_comment }}"
    mode: "0600"
  register: agent_keypair_result
  become: true
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python | default('python3') }}"

- name: Generate ed25519 agent keypair (fallback)
  ansible.builtin.command:
    cmd: >-
      ssh-keygen -t ed25519 -N "" -f {{ agent_key_path }} -C {{ agent_key_comment }}
    creates: "{{ agent_key_path }}"
  register: agent_keypair_fallback_result
  become: true
  when: agent_keypair_result is failed

- name: Set permissions on private key
  ansible.builtin.file:
    path: "{{ agent_key_path }}"
    owner: root
    group: root
    mode: "0600"
  become: true

- name: Set permissions on public key
  ansible.builtin.file:
    path: "{{ agent_key_pub_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true

# Try to register the freshly-generated key so we can show it in the recap.
# On the fallback path, we don't have a structured `key` value, so we just
# slurp the file — same end result, less metadata.
- name: Slurp private key for recap
  ansible.builtin.slurp:
    src: "{{ agent_key_path }}"
  register: agent_private_key_b64
  become: true
  no_log: false

- name: Slurp public key for authorized_keys
  ansible.builtin.slurp:
    src: "{{ agent_key_pub_path }}"
  register: agent_public_key_b64
  become: true

- name: Deploy supabase-agent binary
  ansible.builtin.copy:
    src: supabase-agent
    dest: "{{ agent_binary }}"
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy supabase-selfhosted binary
  ansible.builtin.copy:
    src: supabase-selfhosted
    dest: "{{ info_binary }}"
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Ensure deploy_user .ssh directory exists
  ansible.builtin.file:
    path: "~{{ deploy_user }}/.ssh"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0700"
  become: true

- name: Ensure deploy_user authorized_keys exists
  ansible.builtin.file:
    path: "~{{ deploy_user }}/.ssh/authorized_keys"
    state: touch
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
  become: true

# Install (or refresh) the public key with the command-restriction prefix.
# Idempotency strategy: match any line containing the comment "supabase-agent"
# and replace it with the new restricted line. This handles the three cases
# we care about:
#   1. fresh install — lineinfile appends a new line
#   2. key regenerated — old line is replaced in place
#   3. existing matching line — no change
- name: Install restricted pubkey into authorized_keys
  ansible.builtin.lineinfile:
    path: "~{{ deploy_user }}/.ssh/authorized_keys"
    # Match any line containing the key comment so a regenerated key replaces
    # the old restricted line in place (idempotent across re-runs).
    regexp: '.*{{ agent_key_comment }}$'
    line: 'command="{{ agent_binary }}",no-port-forwarding,no-agent-forwarding,no-X11-forwarding,no-pty {{ (agent_public_key_b64.content | b64decode | trim) }}'
    state: present
    create: false
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
  become: true

# End-of-run recap: only when the key is fresh. Showing the private key is
# inherently a one-shot thing — on subsequent runs the recap is silent.
- name: End-of-run recap (fresh key)
  ansible.builtin.debug:
    msg:
      - "================================================================"
      - " supabase-agent key freshly generated — copy this NOW"
      - "================================================================"
      - "Private key (~/.ssh/<alias> on the client side):"
      - ""
      - "{{ (agent_private_key_b64.content | b64decode) }}"
      - ""
      - "Add this block to your local ~/.ssh/config:"
      - ""
      - "Host supabase-agent"
      - "  HostName <this-server>"
      - "  User {{ deploy_user }}"
      - "  IdentityFile ~/.ssh/<alias>"
      - "  IdentitiesOnly yes"
      - "  StrictHostKeyChecking accept-new"
      - ""
      - "MCP client config (Claude / Cursor / etc.):"
      - ""
      - "  {"
      - "    \"command\": \"ssh\","
      - "    \"args\": [\"supabase-agent\", \"supabase-agent\"]"
      - "  }"
      - "================================================================"
  when:
    - (agent_keypair_result.changed | default(false))
      or (agent_keypair_fallback_result is defined and agent_keypair_fallback_result.changed | default(false))
