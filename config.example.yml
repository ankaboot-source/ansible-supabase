# =============================================================================
# Supabase Deployment Configuration
# =============================================================================
# This is the ONLY file you need to edit before deploying.
#
#   1. Copy this file:   cp config.example.yml config.yml
#   2. Edit the REQUIRED section below.
#   3. Run:              sudo bash setup.sh
#
# AI agents: edit this file programmatically, then run `setup.sh --yes`.
#
# Sections:
#   REQUIRED    — You MUST fill these in. Deployment aborts if left as "changeit".
#   SECRETS     — Auto-generated by default. Set `generate: false` to supply your own.
#   COMPONENTS  — Toggle which optional components to deploy.
#   ADVANCED    — Component-specific config. Only relevant when a component is enabled.
# =============================================================================


# ─────────────────────────────────────────────────────────────────────────────
# REQUIRED  —  You MUST modify every field in this section.
# ─────────────────────────────────────────────────────────────────────────────
required:
  # System user that will run the deployment (e.g. ubuntu, root, your-username).
  # Run `whoami` on the target server if unsure.
  deploy_user: changeit

  # Your application's public URL (where your frontend lives).
  site_url: https://app.example.com

  # Supabase API endpoint — the public URL of this Supabase stack.
  # Used by Studio and client SDKs. Must point at this server's domain.
  api_external_url: https://sb.example.com

  # Domain for the Supabase dashboard (Studio). Routed by the reverse proxy.
  supabase_domain: sb.example.com

  # SMTP credentials — used by Supabase Auth to send confirmation/recovery emails.
  smtp_admin_email: changeit      # e.g. user@example.com
  smtp_host: changeit             # e.g. mail.example.com
  smtp_user: changeit             # e.g. user@example.com
  smtp_password: changeit         # SMTP password


# ─────────────────────────────────────────────────────────────────────────────
# SECRETS  —  Cryptographic keys for Supabase internals.
# ─────────────────────────────────────────────────────────────────────────────
# By default these are auto-generated on first run. Most users leave this alone.
# Set `generate: false` ONLY if you want to provide your own keys (e.g. migrating
# an existing stack).
secrets:
  generate: true
  # The values below are used ONLY when generate: false. Leave as changeit otherwise.
  postgres_db_pwd: changeit
  sb_jwt_secret: changeit
  sb_anon_key: changeit
  sb_service_role_key: changeit
  secret_key_base: changeit
  vault_enc_key: changeit
  pg_meta_crypto_key: changeit
  logflare_public_access_token: changeit
  logflare_private_access_token: changeit
  s3_protocol_access_key_id: changeit
  s3_protocol_access_key_secret: changeit


# ─────────────────────────────────────────────────────────────────────────────
# COMPONENTS  —  Toggle which optional components to deploy.
# ─────────────────────────────────────────────────────────────────────────────
# Set to `true` to enable. Disabled components are skipped entirely.
# When you enable a component, fill in its block under ADVANCED below.
components:
  caddy: false      # Reverse proxy + automatic TLS + SSO (recommended for production)
  monitor: false    # Grafana + Prometheus + Loki monitoring stack
  fail2ban: false   # Brute-force protection for PostgreSQL
  backup: false     # Automated backups + PITR with pgBackRest (recommended)
  ufw: false        # UFW firewall — allow/deny rules per port
  luks: false       # At-rest disk encryption (LUKS)


# ─────────────────────────────────────────────────────────────────────────────
# ADVANCED  —  Component-specific configuration.
# ─────────────────────────────────────────────────────────────────────────────
# Only relevant when the corresponding component is enabled above.
# Leave defaults if unsure; see docs/advanced-docs.md for full reference.
advanced:
  # Container name suffix (e.g. prod, qa). Leave as changeit if not needed.
  deploy_env: changeit

  # ── Caddy / SSO ── (only if components.caddy: true)
  caddy:
    sso_provider: github       # available: Generic, github, gitlab, discord
    root_domain: example.com
    base_auth_domain: auth.example.com
    # SSO provider credentials — fill based on your chosen sso_provider.
    # See docs/advanced-docs.md for per-provider fields.
    sso_client_id: changeit
    sso_client_secret: changeit
    # SSO allow list — space-separated usernames/emails granted admin access.
    # Only used by github, gitlab, and generic providers (discord uses role-based auth).
    sso_allow_list: "user1@gmail.com user2@gmail.com"

  # ── Monitor / Grafana ── (only if components.monitor: true)
  monitor:
    domain: monitor.example.com
    grafana_root_url: https://monitor.example.com
    grafana_alert_host: monitor.example.com
    anonymous_enabled: true     # set false to require login
    admin_password: changeit   # only used when anonymous_enabled: false

  # ── Backup / pgBackRest ── (only if components.backup: true)
  # Automated backups + continuous WAL archiving + point-in-time recovery.
  # Defaults are hobby-safe (local MinIO, no encryption, .env creds).
  # Production hardening: override the 5 vars marked below — nothing else needed.
  backup:
    # Repository type: minio (local, default) | s3 (external) | posix (local fs)
    # WARNING: minio/posix are local — no off-box protection if the server dies.
    repo_type: minio

    # --- S3 repo (only if repo_type: s3) ---
    # ENDPOINT MUST BE HOST-ONLY (no URL path): pgBackRest silently drops any
    # path, so Supabase Cloud Storage's .../storage/v1/s3 endpoint is incompatible.
    # Use the plain provider endpoint, e.g. https://s3.eu-west-1.amazonaws.com
    # (or https://<region>.digitaloceanspaces.com — not the bucket-qualified form).
    s3_endpoint: changeit        # e.g. https://s3.eu-west-1.amazonaws.com
    s3_region: us-east-1
    s3_bucket: changeit         # e.g. supabase-backups
    s3_access_key: changeit
    s3_secret_key: changeit
    s3_uri_style: path          # path for MinIO/R2/Backblaze, host for AWS S3
    s3_verify_tls: true         # set false for self-signed MinIO

    # --- MinIO repo (only if repo_type: minio) ---
    # Defaults: minioadmin/minioadmin. Override for production.
    minio_root_user: minioadmin
    minio_root_password: minioadmin

    # --- Encryption (PROD: set true for external repo) ---
    # OFF for local repo (your box, your key). ON for any external repo.
    # If on, a passphrase is generated and printed — STORE IT OFF THE SERVER.
    # If lost, the backup repo is unrecoverable.
    encryption: false           # forced true when repo_type is s3

    # --- Credentials source (PROD: set vault) ---
    # env = plaintext .env file (warned). vault = Ansible Vault variables.
    creds_source: env

    # --- Retention (PROD: set retention_full to 7) ---
    retention_full: 3           # number of full backups to keep
    retention_diff: 3           # differential backups per full chain
    retention_archive: 3        # WAL archive sets to keep (PITR window)
    # Effective PITR window ≈ min(retention_archive, retention_full) full cycles
    # ≈3 days default, ≈7 days hardened (with weekly fulls + daily diffs)

    # --- Schedules (cron expressions) ---
    cron_full: "0 3 * * 1"      # Mon 03:00 — full backup
    cron_diff: "0 3 * * 2-7"    # Tue–Sun 03:00 — differential backup
    cron_verify: "0 4 * * *"   # Daily 04:00 — repo integrity check

    # --- Restore drill (PROD: set true) ---
    # Off by default — too heavy for a 2 GB VM. When on, performs a full
    # restore into a throwaway volume + starts a 2nd Postgres + healthchecks.
    restore_drill: false

    # --- Storage volume backup ---
    # If Storage uses external S3, the volume backup is skipped automatically.
    storage_backup: true

    # --- pgsodium key backup ---
    # Backs up /etc/postgresql-custom/pgsodium_root.key + custom GUCs.
    # Without the key, all vault.secrets and pgsodium-encrypted columns are lost.
    pgsodium_backup: true

  # ── Firewall (UFW) ── (only if components.ufw: true)
  # SSH (port 22) is always allowed. List additional rules here.
  firewall:
    allow:
      - port: 80
      - port: 443
    deny:
      - port: 3000
      - port: 3001

  # ── LUKS disk encryption ── (only if components.luks: true)
  luks:
    device: changeit           # e.g. /dev/disk/by-id/YOUR_VOLUME_NAME
    mount_point: /data
